[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Auto-refund expired pending numbers every 5 minutes.
# Requires CRON_SECRET env var; the function checks ?key=CRON_SECRET.
[functions."expire-numbers"]
  schedule = "*/5 * * * *"

# Route frontend's /api/* calls to the actual Netlify Functions.
# MUST come before the SPA catch-all below, otherwise /api/* requests
# get swallowed by the index.html redirect (or 404, as you saw).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so client-side routes (e.g. /dashboard) load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
